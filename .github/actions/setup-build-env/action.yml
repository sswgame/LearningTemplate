name: Setup build environment
description: sccache · 컴파일러 · 리눅스 의존 패키지를 준비하고 CC · CXX · VCPKG_OVERLAY_TRIPLETS · PY 를 뒷 단계에 내보낸다.

# ci.yml · fuzz.yml · header-self-contained.yml 이 같이 쓴다 — 준비 단계를 바꾸면 세 워크플로가 함께 바뀐다.
# 호출하는 쪽이 먼저 저장소를 받아 둬야 한다(이 액션 자체가 저장소 안에 있다).
#
# 뒷 단계에 내보내는 환경 변수:
#   CC · CXX                  Windows 는 clang-cl, 리눅스는 clang · clang++. vcpkg 포트 컴파일러도 이것이 정한다(비면 시스템 GCC 로 짓는다).
#   VCPKG_OVERLAY_TRIPLETS    기본 트리플릿 폴더.
#   PY                        bash 단계에서 부를 파이썬(Windows `python`, 리눅스 `python3`).

runs:
  using: composite
  steps:
  - name: Setup sccache
    uses: mozilla-actions/sccache-action@v0.0.11

  - name: MSVC developer environment (Windows)
    if: runner.os == 'Windows'
    uses: ilammy/msvc-dev-cmd@v1

  - name: Setup LLVM (Windows)
    if: runner.os == 'Windows'
    shell: pwsh
    run: |
      echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # 러너 이미지의 clang-cl 버전을 로그와 요약에 남긴다 — 로컬은 Tools/LLVM 20.1.8 로 고정인데 CI 는 이미지 것을 쓴다.
      $version = (& "C:\Program Files\LLVM\bin\clang-cl.exe" --version | Select-Object -First 1)
      echo "clang-cl: $version"
      echo "clang-cl: $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  # apt 미러가 멈추면 이 단계가 러너를 붙잡는다. 평소 1~2 분이므로 `timeout` 으로 빨리 실패시켜 다시 돌리게 한다
  # (합성 액션의 단계는 `timeout-minutes` 를 받지 않는다).
  - name: Setup Linux toolchain & dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo timeout 300 apt-get update
      sudo timeout 600 apt-get install -y --no-install-recommends \
        libclang-dev libtinfo5 zlib1g-dev \
        libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
        libxext-dev libxfixes-dev libxcb1-dev libx11-xcb-dev \
        libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev vulkan-validationlayers
      for candidate in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V -r) /usr; do
        if [ -f "$candidate/include/clang-c/Index.h" ]; then
          echo "LLVM_DIR=$candidate" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=$candidate" >> "$GITHUB_ENV"
          echo "LLVM_HOME=$candidate" >> "$GITHUB_ENV"
          break
        fi
      done

  - name: Export compiler and Python selection
    shell: bash
    run: |
      if [ "$RUNNER_OS" = "Windows" ]; then
        echo "CC=clang-cl" >> "$GITHUB_ENV"
        echo "CXX=clang-cl" >> "$GITHUB_ENV"
        echo "PY=python" >> "$GITHUB_ENV"
      else
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"
        echo "PY=python3" >> "$GITHUB_ENV"
      fi
      echo "VCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/cmake/Modules/Toolchain/Vcpkg" >> "$GITHUB_ENV"
