name: Setup vcpkg
description: vcpkg 바이너리 캐시를 복원하고 vcpkg 를 준비한다. 저장은 호출하는 쪽이 구성 뒤에 한다.

# 복원과 저장을 나눈다. `actions/cache` 하나로 두면 저장이 잡이 성공했을 때만 돌아, 테스트 하나가 지거나 실행이 취소되면 1 시간 걸려 지은 포트가
# 버려진다. 그래서 저장(`actions/cache/save`)은 구성이 끝난 바로 뒤에 호출하는 쪽이 하고, 이 액션은 복원과 준비만 한다(저장 키는 출력으로 준다).
#
# 키에 프리셋을 넣지 않는다 — 기본 트리플릿은 OS 하나에 하나(x64-windows · x64-linux)라 같은 OS 의 잡이 같은 패키지를 쓰고, 프리셋마다
# 따로 두면 저장소 캐시 한도(10 GB)를 세 배로 먹어 서로를 밀어낸다.
# 다른 트리플릿을 쓰는 잡(TSan 의 `x64-linux-tsan`)만 `cache-name` 으로 이름을 가르고 `triplet-hash-glob` 으로 그 트리플릿 폴더 해시를 키 끝에 붙인다.
# 이름은 `vcpkg-bin-<OS>-` 로 시작하면 안 된다 — 다른 잡의 restore-keys 가 접두어로 그 캐시(그 잡의 트리플릿 패키지가 없다)를 집어 포트를
# 처음부터 짓게 된다. 그 트리플릿은 `Toolchain/Vcpkg/` 밖에 있어 기본 키를 바꾸지 않는다.
# `Tools/vcpkg`(클론 · buildtrees · downloads)는 캐시에 넣지 않는다 — 바이너리 캐시만 있으면 포트를 다시 짓지 않고, 클론은 run-vcpkg 가 한다.

inputs:
  cache-name:
    description: 캐시 이름 접두어. 트리플릿이 다른 잡만 바꾼다.
    required: false
    default: vcpkg-bin
  triplet-hash-glob:
    description: 키 끝에 해시로 붙일 트리플릿 폴더 글롭. 비우면 붙이지 않는다.
    required: false
    default: ''

outputs:
  cache-hit:
    description: 키가 정확히 맞았는지.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: 저장에 쓸 키.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
  - name: Restore vcpkg binary cache
    id: restore
    uses: actions/cache/restore@v6
    with:
      path: ${{ github.workspace }}/build/vcpkg_cache
      key: ${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**', 'ThirdParty/*/vcpkg-port/**') }}${{ inputs.triplet-hash-glob != '' && format('-{0}', hashFiles(inputs.triplet-hash-glob)) || '' }}
      restore-keys: |
        ${{ inputs.cache-name }}-${{ runner.os }}-

  - name: Setup vcpkg
    uses: lukka/run-vcpkg@v11
    with:
      vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
      vcpkgJsonGlob: 'vcpkg.json'
