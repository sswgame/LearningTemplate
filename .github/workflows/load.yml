name: Load (Linux | Release, nightly)

# 부하 검증 — Release 로 지어 부하 스위트(ctest -L load, 시간 예산 판정)와 부하 묶음 nightly(Test/Load/Suites.json — 온라인 봇 · 루프백 클러스터)를 돈다.
# 밤마다(KST 04 시) + 손으로. 일반 CI(ci.yml)의 nogpu 집합은 부하 스위트를 빼므로 느려지지 않는다. GPU 가 없어 App 드라이버 조합은 묶음에 넣지 않는다.
# 진 테스트 · 진 조합은 주석으로 올린다(작업 로그 · 아티팩트는 밖에서 403) — Scripts/dev/CiFailureReport.py tests · load.
# 러너는 측정 기계가 아니다: 예산은 이 PC 기준이라 러너가 크게 느리면 시간 예산이 질 수 있다. 기준선은 기계마다라 러너에는 없다(알림만).
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    uses: ./.github/workflows/runners.yml

  load:
    name: Load suites (Linux Clang Release)
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map).linux }}
    timeout-minutes: 150

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # ci.yml 의 리눅스 잡과 같은 키 — 그 잡이 저장한 포트를 읽기만 한다(같은 트리플릿).
    - name: Setup vcpkg
      uses: ./.github/actions/setup-vcpkg

    - name: Configure (CI-Release)
      id: configure
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build | Out-Null
        cmake --preset CI-Release 2>&1 | Tee-Object -FilePath build/configure.log
        exit $LASTEXITCODE

    - name: Report configure failure as annotations
      if: failure() && steps.configure.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py configure --log build/configure.log

    - name: Build
      id: build
      shell: pwsh
      run: |
        cmake --build --preset CI-Release -- -k 0 2>&1 | Tee-Object -FilePath build/build.log
        exit $LASTEXITCODE

    - name: Report build failure as annotations
      if: failure() && steps.build.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py build --log build/build.log

    # 부하 스위트(SW_TEST_LOAD_SUITE)는 직렬이다 — Release 라 SW_TEST_TIME_BUDGET 을 넘은 케이스가 진다.
    - name: Load test suites
      id: suites
      run: |
        ctest --test-dir build/CI-Release -L load --output-on-failure

    - name: Report failed load suites as annotations
      if: failure() && steps.suites.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py tests --ctest-dir build/CI-Release

    # 77 은 "이 러너에서 돌 조합이 없다"(건너뜀)라 성공으로 친다.
    - name: Load scenarios (nightly suite)
      id: scenarios
      if: always() && steps.build.outcome == 'success'
      shell: bash
      run: |
        set +e
        $PY -m Scripts load suite nightly --preset CI-Release --runs 3 --out build/CI-Release/LoadResults/nightly.json
        code=$?
        if [ "$code" = "77" ]; then exit 0; fi
        exit $code

    - name: Report failed load scenarios as annotations
      if: failure() && steps.scenarios.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py load --results build/CI-Release/LoadResults/nightly.json

    - name: Upload load results
      if: always() && steps.build.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: load-results
        path: |
          build/CI-Release/LoadResults/**
        if-no-files-found: ignore
        retention-days: 30
