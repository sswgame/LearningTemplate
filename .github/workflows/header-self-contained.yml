name: Daily compile guards (headers · deadlock detection)

# 매일 한 번 · 수동으로 도는 컴파일 검사 둘 — 어느 구성도 평소에 지키지 않아 썩기 쉽고, 전 트리를 다시 훑느라 push 마다 돌리기엔 길다. 한 번 지은 빌드를 둘이 나눠 쓴다.
#  ① 헤더 하나하나를 혼자 컴파일한다(Scripts/lint/report/RunHeaderSelfContained.py, 3~10 분).
#  ② 아무 프리셋도 켜지 않는 `SW_ENABLE_DEADLOCK_DETECTION` 구성이 컴파일되는지 본다(RunBuildWarnings.py, 약 14 분).
# 커밋 훅은 빌드 폴더가 있는 PC 에서 staged 헤더만 본다(Scripts/lint/gate/CheckHeaderSelfContained.py) — 이 잡은 훅이 못 본 것(빌드 없이 한 커밋,
# 다른 헤더를 정리해 생긴 깨짐)을 잡는다.
#
# 준비 단계는 ci.yml 과 같은 액션(.github/actions)을 쓰고, 구성은 ci.yml 의 Windows Debug 잡과 같은 프리셋이다 —
# 그래야 vcpkg 바이너리 캐시를 그 잡과 나눠 쓴다. ci.yml 의 구성을 바꾸면 여기도 맞춘다. 헤더 단독 컴파일은 PCH 플래그를 떼고 돈다(`HeaderSelfContained.py`).
# vcpkg 캐시는 복원만 한다(저장은 ci.yml 이 한다 — 캐시 한도 10 GB 를 나눠 쓴다).

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  runners:
    uses: ./.github/workflows/runners.yml

  header-self-contained:
    name: Compile guards (Windows clang-cl)
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map).windows }}
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # 복원만 한다(저장은 ci.yml 이 한다).
    - name: Setup vcpkg
      uses: ./.github/actions/setup-vcpkg

    - name: Configure (CI-Debug)
      run: |
        cmake --preset CI-Debug

    # 단독 컴파일은 생성 헤더(리플렉션 FlagOps.gen.h · *.gen.h)가 있어야 가짜 오류가 안 난다 — 구성만 한 폴더는 자리 표시자다.
    # 출력을 파일로도 받아 실패하면 오류 줄을 주석으로 올린다(ci.yml 의 Build 단계와 같다) — 작업 로그는 밖에서 403 이다.
    - name: Build
      id: build
      shell: pwsh
      run: |
        cmake --build --preset CI-Debug -- -k 0 2>&1 | Tee-Object -FilePath build/build.log
        exit $LASTEXITCODE

    - name: Report build failure as annotations
      if: failure() && steps.build.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py build --log build/build.log

    # 두 검사는 같은 빌드를 쓰므로 하나가 져도 다른 하나는 돈다.
    - name: Check that every header compiles on its own
      id: headers
      run: |
        python Scripts/lint/report/RunHeaderSelfContained.py --preset CI-Debug --fail-on-violation

    # `SW_ENABLE_DEADLOCK_DETECTION` 은 어느 프리셋도 켜지 않는 옵션이라 짓지 않으면 썩는다. 구성을 따로 짓지 않고, 방금 지은 컴파일 DB 의
    # 모든 TU 를 그 정의를 더해 -fsyntax-only 로 돌린다(Windows Debug 에서 14 분 — push 마다 돌리기엔 길어 ci.yml 에서 옮겼다).
    # 오류가 있거나 검사한 TU 가 없으면 진다(경고는 컴파일러 버전마다 달라 보고만 한다).
    - name: Compile check with SW_ENABLE_DEADLOCK_DETECTION
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        python Scripts/lint/report/RunBuildWarnings.py --preset CI-Debug --define SW_ENABLE_DEADLOCK_DETECTION --fail-on error
