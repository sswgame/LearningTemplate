name: Header self-containment (daily)

# 헤더 하나하나를 혼자 컴파일한다(Scripts/lint/report/RunHeaderSelfContained.py). 전 트리 3~10 분이라 push 마다 돌리지 않고 하루 한 번 · 수동으로 돈다.
# 커밋 훅은 빌드 폴더가 있는 PC 에서 staged 헤더만 본다(Scripts/lint/gate/CheckHeaderSelfContained.py) — 이 잡은 훅이 못 본 것(빌드 없이 한 커밋,
# 다른 헤더를 정리해 생긴 깨짐)을 잡는다.
#
# 준비 단계는 ci.yml 과 같은 액션(.github/actions)을 쓰고, 구성은 ci.yml 의 Windows Debug 잡과 같은 프리셋이다 —
# 그래야 vcpkg 바이너리 캐시를 그 잡과 나눠 쓴다. ci.yml 의 구성을 바꾸면 여기도 맞춘다. 헤더 단독 컴파일은 PCH 플래그를 떼고 돈다(`HeaderSelfContained.py`).
# vcpkg 캐시는 복원만 한다(저장은 ci.yml 이 한다 — 캐시 한도 10 GB 를 나눠 쓴다).

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  header-self-contained:
    name: Header self-containment (Windows clang-cl)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # 복원만 한다(저장은 ci.yml 이 한다).
    - name: Setup vcpkg
      uses: ./.github/actions/setup-vcpkg

    - name: Configure (CI-Debug)
      run: |
        cmake --preset CI-Debug

    # 단독 컴파일은 생성 헤더(리플렉션 FlagOps.gen.h · *.gen.h)가 있어야 가짜 오류가 안 난다 — 구성만 한 폴더는 자리 표시자다.
    - name: Build
      run: |
        cmake --build --preset CI-Debug

    - name: Check that every header compiles on its own
      run: |
        python Scripts/lint/report/RunHeaderSelfContained.py --preset CI-Debug --fail-on-violation
