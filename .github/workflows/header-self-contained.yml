name: Header self-containment (daily)

# 헤더 하나하나를 혼자 컴파일한다(Scripts/lint/report/RunHeaderSelfContained.py). 전 트리 3~10 분이라 push 마다 돌리지 않고 하루 한 번 · 수동으로 돈다.
# 커밋 훅은 빌드 폴더가 있는 PC 에서 staged 헤더만 본다(Scripts/lint/gate/CheckHeaderSelfContained.py) — 이 잡은 훅이 못 본 것(빌드 없이 한 커밋,
# 다른 헤더를 정리해 생긴 깨짐)을 잡는다.
#
# 준비 단계(sccache · MSVC 환경 · LLVM · vcpkg 캐시 복원 · 구성)는 ci.yml 의 Windows Debug 잡과 같은 모양 · 같은 프리셋 · 같은 PCH 끔이다 —
# 그래야 sccache 와 vcpkg 바이너리 캐시를 그 잡과 나눠 써 빌드가 거의 적중한다. ci.yml 의 그 단계를 바꾸면 여기도 맞춘다.
# vcpkg 캐시는 복원만 한다(저장은 ci.yml 이 한다 — 캐시 한도 10 GB 를 나눠 쓴다).

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  header-self-contained:
    name: Header self-containment (Windows clang-cl)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM
      run: |
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**', 'ThirdParty/*/vcpkg-port/**') }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Debug)
      env:
        CC: clang-cl
        CXX: clang-cl
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset CI-Debug -DSW_ENABLE_PCH=OFF

    # 단독 컴파일은 생성 헤더(리플렉션 FlagOps.gen.h · *.gen.h)가 있어야 가짜 오류가 안 난다 — 구성만 한 폴더는 자리 표시자다.
    - name: Build
      run: |
        cmake --build --preset CI-Debug

    - name: Check that every header compiles on its own
      run: |
        python Scripts/lint/report/RunHeaderSelfContained.py --build build/CI-Debug --fail-on-violation
