name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    name: Code Conventions & Include Linter
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Run Code Conventions Check
      run: |
        python3 Scripts/lint/CheckCodeConventions.py

  build-windows:
    name: Build Windows Debug (clang-cl)
    needs: lint
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.9

    - name: MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM (pre-installed in runner)
      run: |
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-windows-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-windows-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-windows-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Debug preset, clang-cl)
      env:
        CC: clang-cl
        CXX: clang-cl
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset CI-Debug

    - name: Build
      run: |
        cmake --build --preset CI-Debug

    # NoGPU only: EngineTest (Window/RHI) is omitted. EngineTest_NoGPU still runs.
    - name: Test (NoGPU)
      run: |
        ctest --test-dir build/CI-Debug -L nogpu -j 4 --output-on-failure

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-windows-debug
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7


  build-linux:
    name: Build Linux Debug (Clang)
    needs: lint
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.9

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake lld \
          clang llvm-dev libclang-dev \
          xorg-dev libgl1-mesa-dev libglu1-mesa-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxcb1-dev libx11-xcb-dev libvulkan-dev wayland-protocols libwayland-dev libxkbcommon-dev libtinfo5

    - name: Locate LLVM for ReflectionParser
      run: |
        for candidate in /usr/lib/llvm-20 /usr/lib/llvm-19 /usr/lib/llvm-18 /usr/lib/llvm-17 /usr/lib/llvm-16 /usr/lib/llvm-15 /usr/lib/llvm-14; do
          if [ -x "$candidate/bin/clang" ] && [ -f "$candidate/include/clang-c/Index.h" ]; then
            echo "LLVM_DIR=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_HOME=$candidate" >> "$GITHUB_ENV"
            echo "Using $candidate"
            exit 0
          fi
        done
        if [ -x /usr/bin/clang ] && [ -f /usr/include/clang-c/Index.h ]; then
          echo "LLVM_DIR=/usr" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=/usr" >> "$GITHUB_ENV"
          echo "LLVM_HOME=/usr" >> "$GITHUB_ENV"
          echo "Using /usr"
          exit 0
        fi
        echo "LLVM kit not found under /usr/lib/llvm-* or /usr" >&2
        exit 1

    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-linux-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-linux-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-linux-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Debug preset)
      env:
        CC: clang
        CXX: clang++
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset CI-Debug

    - name: Build
      run: |
        cmake --build --preset CI-Debug

    # NoGPU label only; soft-SKIP cases still report as skipped.
    - name: Test (NoGPU)
      run: |
        ctest --test-dir build/CI-Debug -L nogpu -j 4 --output-on-failure

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-linux-debug
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7


