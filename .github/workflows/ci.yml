name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    name: Code Conventions & Include Linter
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Code Conventions Check
      run: |
        python3 Scripts/lint/CheckCodeConventions.py

  build:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Windows Debug (clang-cl)
            os: windows-2022
            preset: CI-Debug

          - name: Build Linux Debug (Clang)
            os: ubuntu-22.04
            preset: CI-Debug

          - name: Build Linux ASan (Clang)
            os: ubuntu-22.04
            preset: CI-Debug-ASAN

          - name: Build Windows Shipping (clang-cl)
            os: windows-2022
            preset: CI-Shipping

          - name: Build Linux Shipping (Clang)
            os: ubuntu-22.04
            preset: CI-Shipping

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.9

    # Windows Environment Setup
    - name: MSVC developer environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Linux Environment Setup
    - name: Setup Linux toolchain & dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake lld \
          clang llvm-dev libclang-dev \
          xorg-dev libgl1-mesa-dev libglu1-mesa-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxcb1-dev libx11-xcb-dev libvulkan-dev wayland-protocols libwayland-dev libxkbcommon-dev libtinfo5
        for candidate in /usr/lib/llvm-20 /usr/lib/llvm-19 /usr/lib/llvm-18 /usr/lib/llvm-17 /usr/lib/llvm-16 /usr/lib/llvm-15 /usr/lib/llvm-14 /usr; do
          if [ -f "$candidate/include/clang-c/Index.h" ]; then
            echo "LLVM_DIR=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_HOME=$candidate" >> "$GITHUB_ENV"
            break
          fi
        done

    # vcpkg Cache and Setup
    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-${{ matrix.preset }}-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    # Configure, Build, and Test
    - name: Configure (${{ matrix.preset }})
      env:
        CC: ${{ runner.os == 'Windows' && 'clang-cl' || 'clang' }}
        CXX: ${{ runner.os == 'Windows' && 'clang-cl' || 'clang++' }}
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: |
        cmake --build --preset ${{ matrix.preset }} ${{ matrix.preset == 'CI-Shipping' && '--target App CoreTest' || '' }}

    - name: Test
      run: |
        ctest --test-dir build/${{ matrix.preset }} ${{ matrix.preset == 'CI-Shipping' && '-R CoreTest' || '-L nogpu' }} -j 4 --output-on-failure

    # Diagnostics & Artifact Upload
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ runner.os }}-${{ matrix.preset }}
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7

    - name: Upload Shipping Artifacts
      if: success() && matrix.preset == 'CI-Shipping' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ runner.os }}-shipping
        path: |
          build/CI-Shipping/Bin/App.exe
          build/CI-Shipping/Bin/App
          build/CI-Shipping/Bin/*.dll
          build/CI-Shipping/Bin/*.so
        retention-days: 14
