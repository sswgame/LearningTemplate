name: CI (Windows · Linux | clang-cl & Clang)

on:
  push:
    branches: [ main, develop ]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.clang-format'
      - '.clangd'
      - '.cursorrules'
      - '.vscode/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Code Conventions & Include Linter
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Run Code Conventions Check
      run: |
        python3 Scripts/lint/gate/CheckCodeConventions.py

  build:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    # 매트릭스 항목에 `reportOnly: true` 를 주면 그 잡은 **보고만 한다**(실패해도 CI 를 붉게 하지 않는다). 새 검사(새니타이저 등)를 처음
    # 켤 때 기존 트리의 보고를 먼저 추리는 동안 쓴다. TSan 은 그렇게 시작해 첫 보고 둘(46c78038)을 고친 뒤 막는 잡이 됐다.
    continue-on-error: ${{ matrix.reportOnly == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Windows Debug (clang-cl)
            os: windows-2022
            preset: CI-Debug

          - name: Build Linux Debug (Clang)
            os: ubuntu-22.04
            preset: CI-Debug

          - name: Build Linux ASan (Clang)
            os: ubuntu-22.04
            preset: CI-Debug-ASAN

          - name: Build Linux TSan (Clang)
            os: ubuntu-22.04
            preset: CI-Debug-TSAN

          # `SW_ENABLE_STL_CONTAINER` 구성(표준 컨테이너 · 할당자)이 컴파일되는지 지킨다. 기본 빌드가 쓰지 않는 옵션이라 돌리지 않으면 썩는다.
          # 다른 잡과 나란히 돌아 벽시계 시간은 늘지 않고, Windows Debug 잡 하나만큼 러너 시간이 는다.
          - name: Build Windows STL containers (clang-cl)
            os: windows-2022
            preset: CI-Debug-STL

          - name: Build Windows Shipping (clang-cl)
            os: windows-2022
            preset: CI-Shipping

          - name: Build Linux Shipping (Clang)
            os: ubuntu-22.04
            preset: CI-Shipping

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.9

    # Windows Environment Setup
    - name: MSVC developer environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Linux Environment Setup
    - name: Setup Linux toolchain & dependencies
      if: runner.os == 'Linux'
      # apt 미러가 멈추면 이 단계가 잡의 기본 제한(6 시간)까지 러너를 붙잡는다 — 실제로 f3097b6a 의 TSan 잡이 여기서 2 시간 넘게 멈췄다.
      # 평소 1~2 분이다. 빨리 실패하게 해서 다시 돌리게 한다.
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libclang-dev libtinfo5 zlib1g-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxext-dev libxfixes-dev libxcb1-dev libx11-xcb-dev \
          libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev
        for candidate in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V -r) /usr; do
          if [ -f "$candidate/include/clang-c/Index.h" ]; then
            echo "LLVM_DIR=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "LLVM_HOME=$candidate" >> "$GITHUB_ENV"
            break
          fi
        done

    # vcpkg Cache and Setup

    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**', 'ThirdParty/*/vcpkg-port/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-${{ matrix.preset }}-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    # Configure, Build, and Test
    - name: Configure (${{ matrix.preset }})
      env:
        CC: ${{ runner.os == 'Windows' && 'clang-cl' || 'clang' }}
        CXX: ${{ runner.os == 'Windows' && 'clang-cl' || 'clang++' }}
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: |
        cmake --build --preset ${{ matrix.preset }}

    # Shipping 도 Debug 와 **같은 집합**을 돈다. 예전엔 Shipping 만 `-R CoreTest` 였고 빌드도
    # `--target App CoreTest` 로 좁혀, EngineTest · ReflectionTest · SmokeTest · EditorTest 가
    # 배포 구성에서 **한 번도 돌지 않았다.** 그런데 Debug 가 숨기는 결함이 드러나는 곳이 바로
    # 그 구성이다 — 실제로 Shipping 에서만 지는 렌더 테스트 둘이 오래 숨어 있었다
    # (docs/06_Backlog.md 2026-09-17 참고). GPU·디스플레이가 필요한 스위트는 `-L nogpu` 가
    # 계속 걸러내므로 러너에서 돌릴 수 있는 것만 는다.
    - name: Test
      env:
        # TSan: 경쟁이 하나라도 보고되면 종료 코드 66 으로 끝나 그 테스트가 진다. 두 번째 스택까지 적어 교착 · 경쟁 원인을 좁힌다.
        TSAN_OPTIONS: "second_deadlock_stack=1 history_size=4"
      run: |
        ctest --test-dir build/${{ matrix.preset }} -L nogpu -j 4 --output-on-failure

    # Diagnostics & Artifact Upload
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ runner.os }}-${{ matrix.preset }}
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7

    - name: Upload Shipping Artifacts
      if: success() && matrix.preset == 'CI-Shipping' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ runner.os }}-shipping
        path: |
          build/CI-Shipping/Bin/App.exe
          build/CI-Shipping/Bin/App
          build/CI-Shipping/Bin/*.dll
          build/CI-Shipping/Bin/*.so
        retention-days: 14
