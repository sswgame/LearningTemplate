        exit 1

    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-linux-asan-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-linux-asan-${{ hashFiles('vcpkg.json') }}-
