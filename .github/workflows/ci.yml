name: CI (Windows · Linux | clang-cl & Clang)

# 문서만 바뀐 push · PR 도 린트 잡은 돈다(문서 경로 게이트 CheckDocPaths · 설정 참조 게이트가 .md 를 본다). 빌드 잡만 건너뛴다 —
# `changes` 잡이 바뀐 파일이 문서 · 편집기 설정뿐인지 보고 `code` 를 낸다. 린트와 빌드는 동시에 시작한다(린트가 지면 빌드를 취소 — non-main).
# 이 파일은 push · PR 마다 도는 단계만 둔다(린트 ∥ 구성 열 개의 빌드 + `-L nogpu`). 매일 · 야간 단계는 header-self-contained.yml · fuzz.yml · load.yml 이고,
# 단계 분류표와 새 검사를 어디 둘지의 기준은 docs/08_Verification.md 4절이다. GPU · 창이 필요한 테스트(hostgpu · race)는 러너에 없어 로컬이 돌린다.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# main 은 돌고 있는 실행을 **끝까지** 돌린다. 같은 그룹에 기다리는 실행은 하나만 남고(더 새 push 가 오면 기다리던 것이 취소된다), 앞 실행이
# 끝나면 그것이 돈다. main 에서 진행 중인 실행까지 지우면 push 가 실행 시간(Windows 15 분~, vcpkg 를 새로 지으면 1 시간+)보다 잦을 때
# 끝나는 실행이 하나도 없다(2026-10-04: 7 시간 동안 완료 0 건). PR · 다른 브랜치는 최신 커밋만 보면 되므로 진행 중인 것도 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 아직 Node 20 으로 선언된 액션(ilammy/msvc-dev-cmd@v1 — 더 새 판이 없다)을 Node 24 로 돌린다.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  runners:
    uses: ./.github/workflows/runners.yml

  lint:
    name: Lints (gates + self-tests)
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map).linux }}
    timeout-minutes: 30
    # 린트가 지면 같은 실행의 진행 중 빌드를 취소한다(아래 마지막 단계).
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    # 게이트 + 셀프테스트 전부(CTest 의 lint 라벨과 같은 목록 · 인자). 빌드 폴더가 없어 CheckSourceGlob 만 건너뛴다(빌드 잡마다 돈다).
    # 시간 표는 lint-timing 아티팩트로 올린다.
    - name: Run all lints (gates + self-tests) with timings
      run: |
        python3 Scripts/lint/RunLintSuite.py --json lint-timing.json --hook-sample 1,10

    - name: Upload lint timings
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-timing
        path: lint-timing.json

    # 린트와 빌드는 동시에 시작하므로, 린트가 지면 이미 도는 빌드 열 개를 이 실행째 취소해 러너를 아낀다. main 은 제외한다 —
    # main 은 돌던 실행을 끝까지 돌리는 규칙(위 concurrency)이고, 취소된 실행은 세션 가드(ListCiJobs)가 실패로 세지 않아 main 의 린트 실패가 가려진다.
    # 취소는 실행 전체에 걸리므로 이 잡도 `cancelled` 로 끝날 수 있다(린트 단계 자체는 failure 로 남는다).
    - name: Cancel the run (builds are pointless after a lint failure)
      if: failure() && github.ref != 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # 바뀐 파일 판정만 하는 가벼운 잡 — 린트와 무관해서 린트와 빌드가 동시에 시작한다.
  changes:
    name: Detect code changes
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.map).linux }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    # 빌드가 볼 것이 바뀌었나 — 바뀐 파일이 모두 문서 · 편집기 설정이면 code=false 로 빌드 잡을 건너뛴다. 비교 기준을 못 얻으면(첫 push ·
    # 수동 실행 · 강제 push 로 사라진 커밋) 빌드한다.
    - name: Detect code changes
      id: changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=true
        if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
           && git fetch --quiet --depth=1 origin "$BASE_SHA"; then
          if ! git diff --name-only "$BASE_SHA" HEAD \
               | grep -qvE '(\.md$|^docs/|^\.gitignore$|^LICENSE$|^\.clang-format$|^\.clangd$|^\.cursorrules$|^\.vscode/)'; then
            code=false
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "build jobs: $code"

  build:
    name: ${{ matrix.name }}
    needs: [ runners, changes ]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.runners.outputs.map)[matrix.os] }}
    # vcpkg 를 처음부터 지으면 Windows 에서 한 시간이 넘으므로 한도는 그보다 길게 둔다.
    timeout-minutes: 180
    # 매트릭스 항목에 `reportOnly: true` 를 주면 그 잡은 보고만 한다(실패해도 CI 를 붉게 하지 않는다). 새 검사(새니타이저 등)를 처음 켜고
    # 기존 트리의 보고를 추리는 동안 쓴다.
    continue-on-error: ${{ matrix.reportOnly == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Windows Debug (clang-cl)
            os: windows
            preset: CI-Debug

          - name: Build Linux Debug (Clang)
            os: linux
            preset: CI-Debug

          # Wayland 창 계층까지 짓는다(`configureArgs`, 계획 WaylandWindowLayer W2). 기본 창 계층은 그대로 X11 이라 nogpu · swrender 가
          # 켠 채의 X11 길을 지키고, Wayland 길은 "Wayland window layer smoke" 단계가 본다. Wayland 코드가 CI 에서 처음 컴파일되므로
          # 보고만 한다 — 첫 실행들이 초록이면 `reportOnly` 를 지우고 위 Linux Debug 잡에 `configureArgs` 를 옮겨 이 잡을 없앤다.
          - name: Build Linux Debug Wayland (Clang)
            os: linux
            preset: CI-Debug
            configureArgs: -DSW_ENABLE_WAYLAND=ON
            wayland: true
            reportOnly: true

          - name: Build Linux ASan (Clang)
            os: linux
            preset: CI-Debug-ASAN

          # 프리셋이 트리플릿 `x64-linux-tsan`(cmake/Modules/Toolchain/VcpkgTsan — Jolt · Box2D 를 -fsanitize=thread 로 짓는다)을 쓴다.
          # 포트가 다른 리눅스 잡과 겹치지 않아 vcpkg 캐시를 따로 둔다(`vcpkgCache`, 아래 Restore 단계 주석).
          - name: Build Linux TSan (Clang)
            os: linux
            preset: CI-Debug-TSAN
            vcpkgCache: vcpkg-bin-tsan

          # `SW_ENABLE_STL_CONTAINER` 구성(컨테이너 기본 할당자를 std::allocator 로 바꾼 구성)이 컴파일되는지 지킨다. 기본 빌드가 쓰지 않는 옵션이라 돌리지 않으면 썩는다.
          - name: Build Windows STL containers (clang-cl)
            os: windows
            preset: CI-Debug-STL

          - name: Build Windows Shipping (clang-cl)
            os: windows
            preset: CI-Shipping

          - name: Build Linux Shipping (Clang)
            os: linux
            preset: CI-Shipping

          # 전용 서버 배포본(SW_TARGET_TYPE=Server) — 에디터 · App · RHI 백엔드 없이 서는지, ServerTest(nogpu)가 실제 Server 를 띄운다.
          # 리눅스 러너에는 화면이 없어 서버가 X11 을 찾으면 여기서 진다.
          - name: Build Windows Dedicated Server Shipping (clang-cl)
            os: windows
            preset: CI-Shipping-Server

          - name: Build Linux Dedicated Server Shipping (Clang)
            os: linux
            preset: CI-Shipping-Server

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # 저장은 구성이 끝난 뒤 아래 단계가 한다(캐시 키 규칙은 액션 파일 머리말).
    - name: Setup vcpkg
      id: vcpkg-cache
      uses: ./.github/actions/setup-vcpkg
      with:
        cache-name: ${{ matrix.vcpkgCache || 'vcpkg-bin' }}
        triplet-hash-glob: ${{ matrix.vcpkgCache && 'cmake/Modules/Toolchain/VcpkgTsan/**' || '' }}

    # Configure, Build, and Test
    - name: Configure (${{ matrix.preset }})
      id: configure
      # 출력을 파일로도 받는다(아래 실패 보고가 읽는다). CC · CXX · VCPKG_OVERLAY_TRIPLETS 는 준비 단계가 내보낸다.
      # Windows 에서 Git Bash 를 쓰면 /usr/bin/link 가 MSVC link.exe 를 가리므로 두 OS 모두 pwsh 로 —
      # pwsh 는 파이프 뒤에도 cmake 의 종료 코드를 $LASTEXITCODE 에 둔다.
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force build | Out-Null
        cmake --preset ${{ matrix.preset }} ${{ matrix.configureArgs }} 2>&1 | Tee-Object -FilePath build/configure.log
        exit $LASTEXITCODE

    # 구성(vcpkg 설치)에서 진 잡은 "vcpkg install failed" 한 줄만 남는다 — vcpkg 가 가리킨 포트 로그의 끝을 주석으로 올린다.
    - name: Report configure failure as annotations
      if: failure() && steps.configure.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py configure --log build/configure.log

    # 같은 키를 다른 잡이 먼저 저장했으면 경고만 남기고 넘어간다.
    - name: Save vcpkg binary cache
      if: always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/build/vcpkg_cache
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    # 출력을 파일로도 받는다 — 컴파일러 오류가 주석으로 안 잡히는 실패(링크 · TSan 구성)를 아래 단계가 올린다.
    - name: Build
      id: build
      shell: pwsh
      run: |
        # `-k 0`: 실패한 번역 단위가 있어도 끝까지 지어 오류를 한 번에 모은다(리눅스 전용 소스가 여럿 깨졌을 때 한 번에 하나씩 보이는 것을 막는다).
        cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -FilePath build/build.log
        exit $LASTEXITCODE

    - name: Report build failure as annotations
      if: failure() && steps.build.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py build --log build/build.log

    # 전용 서버는 X 가 없는 기계에서 선다 — 서버 실행 파일과 함께 싣는 공유 라이브러리(엔진 · 게임)가 libX11 · libxcb 를 요구하면 동적 링커가
    # main 전에 진다. 화면이 없는 러너의 ServerTest 도 이것을 잡지만 어느 파일이 끌어왔는지는 여기서 보인다(계획 DedicatedServerNoRenderer S3).
    # 처음 켜는 검사라 보고만 한다(Bin 에 함께 놓이는 서드파티 .so 가 걸리는지 모른다) — 첫 실행들이 초록이면 이 줄을 지운다.
    - name: Dedicated server has no X11 dependency (Linux)
      if: matrix.preset == 'CI-Shipping-Server' && matrix.os == 'linux'
      continue-on-error: true
      shell: bash
      run: |
        cd build/${{ matrix.preset }}/Bin
        found=0
        while IFS= read -r file; do
          if readelf -d "$file" | grep -E 'NEEDED.*\[(libX11|libxcb|libX11-xcb)[.-]'; then
            echo "::error file=$file::$file needs X11 (dedicated server must not)"
            found=1
          fi
        done < <(find . -maxdepth 4 -type f \( -name Server -o -name '*.so' -o -name '*.so.*' \))
        exit $found

    # (`SW_ENABLE_DEADLOCK_DETECTION` 컴파일 확인은 전 TU 를 다시 훑느라 이 잡의 14 분을 차지해 매일 도는 header-self-contained.yml 로 옮겼다.)

    # CheckSourceGlob 은 빌드 폴더의 compile_commands.json 과 소스 글롭을 대조한다(린트 잡은 빌드 폴더가 없어 건너뛴다). 구성마다 짓지 않는
    # 소스가 다르므로(플랫폼 · Shipping · 서버 타깃) 빌드 잡마다 그 구성으로 한 번 돌려, 새 .cpp 가 어느 구성에서 빌드 밖으로 빠졌는지 잡는다.
    - name: Source glob coverage
      run: |
        ctest --test-dir build/${{ matrix.preset }} -R "^CheckSourceGlob$" --output-on-failure

    # Shipping 도 Debug 와 같은 집합을 돈다 — Debug 가 숨기는 결함(최적화 · 정적 링크 · 로그 매크로 제거로만 드러나는 것)은 배포 구성에서
    # 드러나므로 Shipping 을 일부 실행 파일로 좁히지 않는다. GPU · 디스플레이가 필요한 스위트는 `-L nogpu` 가 걸러낸다.
    # TSan 옵션(억제 목록 · 두 번째 스택)은 ctest 항목이 든다(`sw_applySanitizerTestProperties`) — 여기서 따로 주지 않는다.
    # `-FS SWTestBinaries`: 위 Build 단계가 빌드 프리셋(`with-tests`)으로 `all` 과 `AllTests` 를 이미 지었다. 셋업 항목 `BuildTestBinaries` 를 돌리면 ninja 를
    # 한 번 더 불러 CMake 를 다시 돌리고 테스트 실행 파일을 다시 링크하다 Windows 에서 파일 잠금(`OnlineLoadBot.exe` · z-applocal)으로 졌다. 건너뛰면 두 번째 링크가 없다.
    # `-j` 는 러너 코어 수다(Windows 는 NUMBER_OF_PROCESSORS, 리눅스는 nproc) — 공개 저장소의 호스티드 러너는 4 코어라 값은 같고, 러너가 바뀌면 따라간다.
    # 병렬이 깨지는 테스트(포트 · 고정 파일)는 CTest 자원 잠금이 직렬로 만든다(Test/TestPolicy.json) — 로컬 `ctest -j`(값 없이)도 같은 길이다.
    - name: Test
      id: test
      run: |
        ctest --test-dir build/${{ matrix.preset }} -L nogpu -j "${NUMBER_OF_PROCESSORS:-$(nproc)}" --output-on-failure -FS SWTestBinaries

    # 소프트웨어 렌더러 묶음(`swrender`, C-41 4단계 · 결정 기록 5-12) — GPU 가 없는 러너에서 호스트 케이스 일부(Test/TestPolicy.json 의
    # softwareRenderCases)를 소프트웨어 래스터라이저로 돈다: Windows 는 WARP(DX11 · DX12), 리눅스는 mesa lavapipe(Vulkan) · llvmpipe(OpenGL) + xvfb.
    # 그림은 비교하지 않는다(소프트웨어 렌더러 전용 골든은 두지 않는다). 정책 softwareRequiredBackends 의 백엔드가 서지 못하면 진다.
    # 처음 켜는 검사라 보고만 한다(continue-on-error) — 첫 실행들이 초록이면 이 줄을 지운다.
    - name: Install software renderer (Linux)
      if: matrix.preset == 'CI-Debug' && matrix.os == 'linux'
      shell: bash
      run: |
        sudo apt-get update -q
        # 콘솔 오버레이는 Xft(fontconfig)로 그린다 — 실행에 libxft2 와 글꼴 하나(fonts-dejavu-core)가 있어야 X11DevConsoleTest 가 오버레이를 세운다(글꼴이 없으면 콘솔을 세우지 않는다).
        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri xvfb libxft2 fonts-dejavu-core

    - name: Test on software renderer
      id: swrender
      if: matrix.preset == 'CI-Debug'
      continue-on-error: true
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a ctest --test-dir build/${{ matrix.preset }} -L swrender --output-on-failure -FS SWTestBinaries
        else
          ctest --test-dir build/${{ matrix.preset }} -L swrender --output-on-failure -FS SWTestBinaries
        fi

    - name: Report software renderer failures as annotations
      if: steps.swrender.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py tests --ctest-dir build/${{ matrix.preset }}

    # Wayland 창 계층(계획 WaylandWindowLayer W2) — headless weston 위에서 Vulkan(lavapipe)으로 창을 세우고 120 프레임 뒤 0 으로
    # 끝나는지, GL · 모르는 계층 값은 X11 로 새지 않고 오류로 서는지 본다. 러너의 headless 컴포지터에는 seat 가 없을 수 있어 입력 리스너
    # 없이 창이 서는 것까지가 확인 대상이다. nogpu 가 져도 돈다. 잡 전체가 보고만 한다(위 매트릭스의 `reportOnly`).
    - name: Wayland window layer smoke (Linux)
      if: always() && matrix.wayland == true && steps.build.outcome == 'success'
      shell: bash
      run: |
        sudo timeout 300 apt-get install -y --no-install-recommends weston mesa-vulkan-drivers
        export XDG_RUNTIME_DIR="$(mktemp -d)"
        chmod 700 "$XDG_RUNTIME_DIR"
        weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 > "$XDG_RUNTIME_DIR/weston.log" 2>&1 &
        for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break; sleep 0.2; done
        if [ ! -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
          cat "$XDG_RUNTIME_DIR/weston.log"
          echo "::error::weston headless did not open wayland-ci"
          exit 1
        fi
        unset DISPLAY
        export WAYLAND_DISPLAY=wayland-ci SW_RHI_SOFTWARE_ADAPTER=1
        cd build/${{ matrix.preset }}/Bin
        failed=0
        expect() { # <로그> <기대 종료: zero|nonzero> <종료 코드> <로그에 있어야 할 줄>...
          local log="$1" want="$2" code="$3"; shift 3
          if { [ "$want" = zero ] && [ "$code" -ne 0 ]; } || { [ "$want" = nonzero ] && [ "$code" -eq 0 ]; }; then
            echo "::error::$log: exit code $code (want $want)"; failed=1
          fi
          for line in "$@"; do
            grep -qF -- "$line" "$log" || { echo "::error::$log: missing '$line'"; failed=1; }
          done
          tail -n 40 "$log"
        }
        # 액션의 bash 는 `-e` 라 종료 코드는 `|| code=$?` 로 받는다.
        code=0; SW_WINDOW_BACKEND=wayland timeout 300 ./App -vk -gv_profileFrames=120 > wayland-vk.log 2>&1 || code=$?
        expect wayland-vk.log zero $code "Window backend: Wayland" "Native Wayland Window created"
        code=0; SW_WINDOW_BACKEND=wayland timeout 120 ./App -gl -gv_profileFrames=20 > wayland-gl.log 2>&1 || code=$?
        expect wayland-gl.log nonzero $code "OpenGL on Linux needs an X11 window"
        code=0; SW_WINDOW_BACKEND=foo timeout 120 ./App -vk -gv_profileFrames=20 > wayland-foo.log 2>&1 || code=$?
        expect wayland-foo.log nonzero $code "is not a window backend"
        exit $failed

    # 진 테스트를 주석(annotation)으로 올린다. 작업 로그 · 아티팩트는 저장소 관리자만 받을 수 있어(공개 저장소라도 API 는 403), 무엇이
    # 졌는지 밖에서 보이는 곳은 주석뿐이다. 테스트마다 실패 줄 · 마지막 `[ RUN ]` · 출력의 마지막 25 줄, 그리고 크래시 스택(Scripts/dev/CiFailureReport.py).
    - name: Report failed tests as annotations
      if: failure() && steps.test.outcome == 'failure'
      shell: bash
      run: |
        $PY Scripts/dev/CiFailureReport.py tests --ctest-dir build/${{ matrix.preset }}

    # Diagnostics & Artifact Upload
    # 트레이스(`*.trace.json` — 성능 회귀 · 느린 틱 · bugit 이 남긴다)도 같이 올린다. Perfetto UI 로 연다.
    # 테스트 단계가 돌았을 때만 올린다 — 빌드에서 진 잡에는 LastTest.log 가 없어 "No files were found" 경고만 남았다.
    - name: Upload test logs on failure
      if: failure() && steps.test.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: test-logs-${{ runner.os }}-${{ matrix.preset }}${{ matrix.wayland && '-wayland' || '' }}
        path: |
          build/${{ matrix.preset }}/Testing/Temporary/LastTest*.log
          build/${{ matrix.preset }}/Bin/*.log
          build/${{ matrix.preset }}/Bin/Saved/Logs/crash_*
          build/${{ matrix.preset }}/Bin/Saved/Traces/*.trace.json
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload Shipping Artifacts
      if: success() && matrix.preset == 'CI-Shipping' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: game-${{ runner.os }}-shipping
        path: |
          build/CI-Shipping/Bin/App.exe
          build/CI-Shipping/Bin/App
          build/CI-Shipping/Bin/*.dll
          build/CI-Shipping/Bin/*.so
        retention-days: 14
