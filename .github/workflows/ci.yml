      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-linux-asan
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7

  build-windows-shipping:
    name: Build Windows Shipping (clang-cl)
    needs: lint
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup sccache
      uses: mozilla/sccache-action@v0.0.9

    - name: MSVC developer environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM (pre-installed in runner)
      run: |
        echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache vcpkg tools and binary artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/Tools/vcpkg
          ${{ github.workspace }}/build/vcpkg_cache
        key: vcpkg-${{ runner.os }}-windows-shipping-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('cmake/Modules/Toolchain/Vcpkg/**') }}
        restore-keys: |
