          vcpkg-${{ runner.os }}-windows-shipping-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/Tools/vcpkg
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Shipping preset, clang-cl)
      env:
        CC: clang-cl
        CXX: clang-cl
        VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/Modules/Toolchain/Vcpkg
      run: |
        cmake --preset CI-Shipping

    - name: Build App + CoreTest
      run: |
        cmake --build --preset CI-Shipping --target App CoreTest

    # Only App + CoreTest are built under Shipping preset.
    - name: Test (CoreTest under Shipping)
      run: |
        ctest --test-dir build/CI-Shipping -R CoreTest -j 4 --output-on-failure

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-windows-shipping
        path: |
          build/**/Testing/Temporary/LastTest.log
          build/**/Bin/*.log
        retention-days: 7

    - name: Upload Shipping Artifacts
      if: success() && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: game-windows-shipping
        path: |
          build/CI-Shipping/Bin/App.exe
          build/CI-Shipping/Bin/*.dll
        retention-days: 14

