name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '2024.01.12'
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Debug preset)
      run: |
        cmake --preset CI-Debug -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build --preset CI-Debug

    # Full ctest: GPU suites may SKIP (not fake-pass) when initialize fails — see TestRHI.
    - name: Test
      run: |
        ctest --test-dir build/CI-Debug --output-on-failure

  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake xorg-dev libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '2024.01.12'
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (CI-Debug preset)
      run: |
        cmake --preset CI-Debug -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build --preset CI-Debug

    - name: Test (NoGPU)
      run: |
        ctest --test-dir build/CI-Debug -L nogpu --output-on-failure

  build-windows-shipping:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '2024.01.12'
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Configure (Ninja-Shipping)
      run: |
        cmake --preset Ninja-Shipping -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build App + CoreUtilityTest
      run: |
        cmake --build --preset Ninja-Shipping --target App CoreUtilityTest

    - name: Test (NoGPU under Shipping)
      run: |
        ctest --test-dir build/Ninja-Shipping -L nogpu --output-on-failure

  lint-format:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pin clang-format via apt package version when available (Ubuntu 22.04 ships 14.x).
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14 || sudo apt-get install -y clang-format
        (command -v clang-format-14 >/dev/null && sudo ln -sf "$(command -v clang-format-14)" /usr/local/bin/clang-format) || true
        clang-format --version

    - name: Check formatting
      run: |
        find Source Test Tools/ReflectionParser -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format --dry-run --Werror
