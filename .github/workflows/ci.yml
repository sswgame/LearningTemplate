            exit 0
          fi
        done
        if [ -x /usr/bin/clang ] && [ -f /usr/include/clang-c/Index.h ]; then
          echo "LLVM_DIR=/usr" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=/usr" >> "$GITHUB_ENV"
