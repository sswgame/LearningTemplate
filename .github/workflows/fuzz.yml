name: Fuzz (Linux | libFuzzer)

# 커버리지 안내 퍼징 — 로더 대상 표(Test/EngineTest/LoaderFuzzTargets.cpp)를 대상마다 60 초씩. 밤마다(KST 03 시) + 손으로.
# 크래시 · 시간 초과 입력은 아티팩트로, 진 대상 이름은 주석으로 올리고 잡을 붉게 한다. 말뭉치 캐시는 아직 두지 않는다(저장소 캐시 10 GB 한도 — 재고 나서).
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: LoaderFuzzer (Linux Clang + ASan)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    # ci.yml 의 리눅스 잡과 같은 키 — 그 잡이 저장한 포트를 읽기만 한다(같은 트리플릿).
    - name: Setup vcpkg
      uses: ./.github/actions/setup-vcpkg

    - name: Configure (CI-Fuzz)
      run: |
        cmake --preset CI-Fuzz

    - name: Build LoaderFuzzer
      run: |
        cmake --build --preset CI-Fuzz --target LoaderFuzzer

    - name: Fuzz every target
      id: fuzz
      run: |
        set -u
        fuzzer=build/CI-Fuzz/Bin/LoaderFuzzer
        mkdir -p fuzz
        : > fuzz/failed.txt
        for target in $(SW_FUZZ_LIST=1 "$fuzzer"); do
          mkdir -p "fuzz/$target/corpus" "fuzz/$target/seeds"
          # 씨앗 덤프가 지면 그 대상만 실패로 적고 다음 대상으로 간다(한 대상의 실패가 나머지를 막지 않는다).
          if ! (cd build/CI-Fuzz/Bin && SW_FUZZ_TARGET="$target" SW_FUZZ_DUMP_SEEDS="$GITHUB_WORKSPACE/fuzz/$target/seeds" ./LoaderFuzzer); then
            echo "$target" >> fuzz/failed.txt
            echo "::error title=fuzz $target::seed dump failed - see the job log"
            continue
          fi
          # 출력을 파일로도 받아(pipefail 로 종료 코드는 퍼저 것) 실패하면 보고 줄 · 스택 · 재현 입력(Base64)을 주석으로 올린다 — 작업 로그 · 아티팩트는 밖에서 403 이다.
          if ! (set -o pipefail; cd build/CI-Fuzz/Bin && SW_FUZZ_TARGET="$target" ./LoaderFuzzer "$GITHUB_WORKSPACE/fuzz/$target/corpus" "$GITHUB_WORKSPACE/fuzz/$target/seeds" \
                -max_total_time=60 -timeout=10 -rss_limit_mb=4096 -artifact_prefix="$GITHUB_WORKSPACE/fuzz/$target/" 2>&1 | tee "$GITHUB_WORKSPACE/fuzz/$target/log.txt"); then
            echo "$target" >> fuzz/failed.txt
            $PY Scripts/dev/CiFailureReport.py fuzz --log "fuzz/$target/log.txt" --target "$target"
          fi
        done
        test ! -s fuzz/failed.txt

    - name: Upload findings
      if: failure() && steps.fuzz.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: fuzz-findings
        path: |
          fuzz/failed.txt
          fuzz/**/log.txt
          fuzz/**/crash-*
          fuzz/**/timeout-*
          fuzz/**/oom-*
        if-no-files-found: ignore
        retention-days: 14
