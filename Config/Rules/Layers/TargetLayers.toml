# 타깃 경계 표 — 읽는 곳은 Scripts/generate/TargetLayers.py. `Source/` 가 모든 타깃의 include 루트라, 폴더 층 표(EngineLayers · EditorLayers)가 보지 못하는 타깃 사이 include 는
# 헤더만 쓰면 컴파일 · 링크가 된다. 그래서 타깃마다 "보면 안 되는 경로" 를 적고 그 헤더마다 같은 경로의 #error 껍데기를 include 자리 맨 앞에 놓는다(EngineLayers 와 같은 틀).
# 언리얼 Build.cs 가 선언한 모듈 폴더만 include 경로에 싣는 것과 같은 자리다(기억).
#
# [gate] 의 값은 `Source/` 기준 경로 접두어 목록이다. 없는 경로를 적으면 configure 가 멈춘다.
# 키트 · 확장 · 게임은 아래 공통 게이트에 더해 매니페스트(`*.module.json` 의 `_listDependency` 전이 폐쇄) 밖 모듈의 헤더를 막는 모듈별 게이트(`module/<이름>`)를 받는다 — 표에 적지 않는다.
[gate]
core = ["Engine", "ModuleAPI", "DevTools", "Editor", "ModuleManager", "App", "Server", "GameFramework", "Games", "Programs"]
engine = ["ModuleAPI", "DevTools", "Editor", "ModuleManager", "App", "Server", "GameFramework", "Games", "Programs"]
devtools = ["ModuleAPI", "Editor", "ModuleManager", "App", "Server", "GameFramework", "Games", "Programs"]
editor = ["ModuleManager", "App", "Server", "GameFramework", "Games", "Programs"]
modulemanager = ["Editor", "App", "Server", "GameFramework", "Games", "Programs"]
app = ["Editor", "Server", "GameFramework", "Games", "Programs"]
server = ["App", "Editor", "GameFramework", "Games", "Programs"]
gameframework = ["DevTools", "Editor", "ModuleManager", "App", "Server", "Games", "Programs", "GameFramework/Kits", "GameFramework/Plugin"]
kit = ["DevTools", "Editor", "ModuleManager", "App", "Server", "Games", "Programs", "GameFramework/Plugin"]
game = ["DevTools", "Editor", "ModuleManager", "App", "Server", "Programs", "GameFramework/Plugin"]
editorextension = ["ModuleManager", "App", "Server", "Games", "Programs"]
# 전용 서버 구성은 오디오 · 렌더러 · 런타임 UI · 클라이언트 전용 소스 헤더를 읽지 않는다 — 이음매는 `IEngineAudioDriver` · `ISoundPlayer` · `IEngineRenderDriver` · `IEngineUIDriver` 와 게임 코드의 창구다.
# Server 타깃 구성의 모든 타깃이 더 받는다(`sw_applyTargetLayerGate`). 엔진 폴더는 `cmake/Engine/BuildLayout.cmake` 의 `SW_UNBUILT_ENGINE_FOLDERS`(서버)와 같아야 한다 —
# 생성기가 대조해 빠지면 configure 가 멈춘다. 클라이언트 전용 소스 폴더(`Client/`)는 모듈 · 게임마다 있어 아래 `[gatefolder]` 가 이름으로 막는다.
serverbuild = ["Engine/Audio", "Engine/Renderer", "Engine/UI", "Engine/Window/Linux", "Engine/Input/Linux"]
# 리플렉션 파서는 Core 만 링크한다(Engine.dll 과 순환) — 그래도 리플렉션 스키마(매크로 · 키 · 형식 기술자)는 엔진과 같아야 해 Engine 헤더 몇 개를 읽는다.
# `Source/` 가 Core 의 include 루트라 경로로는 나머지 Engine 헤더를 막지 못한다 — 게이트로 Engine 전체를 막고 아래 `[allow]` 의 헤더만 연다.
reflectionparser = ["Engine", "ModuleAPI", "DevTools", "Editor", "ModuleManager", "App", "Server", "GameFramework", "Games"]

# [gatefolder] 게이트 이름 → 그 이름의 폴더(`Source/` 아래 어느 깊이든) 안 헤더를 모두 막는다. 같은 DLL(GameFramework · 게임 모듈 · DevTools)이 짓는 폴더라 타깃으로는
# 가르지 못하지만, 서버 구성은 그 폴더의 소스를 짓지 않으므로(`SW_CLIENT_ONLY_SOURCE_PATTERNS`) 그 구성의 모든 타깃에서 헤더를 막아도 된다. 키트의 `Client/` 는
# 따로 짓는 모듈(`GF_Client_<X>`)이라 모듈별 게이트도 막는다. 그 이름의 폴더가 하나도 없으면 configure 가 멈춘다.
[gatefolder]
serverbuild = ["Client"]

# [allow] 게이트 이름 → 그 게이트가 막는 접두어 안에서도 여는 헤더(`Source/` 기준 경로). 연 헤더가 include 하는 헤더도 모두 열려 있어야 한다 — 아니면 configure 가 멈춘다.
# 언리얼 Build.cs 의 `PublicIncludePathModuleNames`(헤더만 쓰고 링크하지 않는 의존)와 같은 자리다. 이 목록이 CMake 의 `ReflectionSchema` 헤더 묶음이기도 하다
# (`SW_TARGET_LAYER_ALLOW_<게이트>`, Source/Programs/ReflectionParser/CMakeLists.txt) — 구현이 필요한 헤더를 넣지 않는다(파서가 링크하지 못한다).
[allow]
reflectionparser = [
	"Engine/EngineMinimal.h",
	"Engine/Foundation/EngineDefines.h",
	"Engine/Foundation/Foundation.h",
	"Engine/Reflection/EnumInfo.h",
	"Engine/Reflection/FunctionInfo.h",
	"Engine/Reflection/PropertyInfo.h",
	"Engine/Reflection/ReflectionAnnotationKeys.h",
	"Engine/Reflection/ReflectionConstants.h",
	"Engine/Reflection/ReflectionContainers.h",
	"Engine/Reflection/ReflectionEnumNames.h",
	"Engine/Reflection/ReflectionIntellisense.h",
	"Engine/Reflection/ReflectionMacros.h",
	"Engine/Reflection/ReflectionMetadataBox.h",
	"Engine/Reflection/ReflectionTypes.h",
	"Engine/Reflection/ReflectionUnits.h",
	"Engine/Reflection/TextAddress.h",
	"Engine/Reflection/TypeCastHeader.h",
	"Engine/Reflection/TypeInfo.h",
	"Engine/Reflection/TypeLookupCache.h",
]
