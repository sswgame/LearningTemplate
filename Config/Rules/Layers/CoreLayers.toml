# Core 폴더 티어 표 — `Source/Core/CMakeLists.txt` 가 읽어 티어마다 OBJECT 부분(`Core_tier<N>_objects`)을 짓고, 부분 N 의 include 자리 맨 앞에 N 보다 위 티어
# 헤더의 `#error` 껍데기를 둔다(Engine 층 부분과 같은 틀). 하위 폴더 티어 `[subtier]` 도 같이 읽는다 — 파일의 티어는 가장 긴 키가 정한다.

# 폴더 → 티어. 숫자가 큰 쪽이 위다.
# 새 폴더는 티어를 정해 여기에 넣는다(표에 없는 폴더는 구성이 선다).
# 부분마다 pch 는 `CoreMinimal.h` 의 include 가운데 그 티어 이하만 담는다 — `Log` 보다 낮은 티어 코드는 `Logger.h` 없이 컴파일된다.
# CMake 가 줄 단위로 읽으니 줄 모양(`폴더 = 숫자` · `"폴더/하위" = 숫자`)을 바꾸지 않는다.
[tier]
Foundation = 0     # 언어 · 플랫폼 바닥(형식 · 매크로 · 정의 · OS 헤더 · enum 플래그 · ASCII · 16진 글자)
Hash = 0           # 해시 · 씨앗 상수와 비밀 비교(언리얼 Core/Hash) — 컨테이너가 기본 해시로 쓴다
Predefined = 0      # 인자 · 이름 표(.xxx) — 아무것도 include 하지 않는다
Concurrency = 1     # 원시 동기화(atomic · mutex · SpinLock · Futex)와 경합 검출 훅
Math = 1
Memory = 2          # 할당기 · 메모리 태그 · 할당 기록기 인터페이스
Algorithm = 2       # 컨테이너 형식에 묶이지 않은 알고리즘(VectorUtil · CompareUtil · UnionFindUtil) — 언리얼 Core/Algo
Container = 3       # 컨테이너 · 핸들 표 · 슬롯 · 링 · 그래프 자료 구조와 std 래퍼(string.h 포함 — 언리얼 Containers)
String = 4          # 로그 없는 글자 도구(UTF 변환 · 분할 · 포맷 · 빌더 · 이스케이프 · 고정 문자열) — 언리얼 Core/String, Godot core/string
Encoding = 4        # 바이트 ↔ 글자 인코딩(Base64 · Hex · FourCC) — 언리얼 Misc/Base64 · String/BytesToHex
Delegate = 4
Path = 4            # 경로 값 형식(AbsolutePath) — 로그 · 파일을 쓰지 않는다. 프로세스(ProcessCommand) · 파일 · 모듈이 함께 쓴다
UUID = 4
Serialization = 4   # 바이트 · 비트 직렬화(ByteReader · ByteWriter · BitStream) — 파일 형식과 네트워크가 함께 쓴다
Subsystem = 4       # 서브시스템 계약(ISubsystem)과 의존 순서 목록(SubsystemCollection) — 로그를 남기지 않아 Log 아래에 선다
Log = 5             # 로그 매크로와 전역 창구(Logger) · 싱크 포트(ILogSink). 하위 Log/Sink(기본 싱크 AsyncLogSink 와 출력 장치)는 맨 위 층이다 —
                    # 파일 · 프로세스 · 진단을 쓰므로 Diagnostics 보다 위에 선다(포트는 아래, 구현은 위 — 언리얼 Logging · OutputDevice).
CommandLine = 6
Compression = 6
Process = 6         # 프로세스 · 종료 신호 · 스레드 크래시 스택
Name = 6            # intern 이름(hashed_string · TagID) — 이름 풀 · 로그를 쓴다(언리얼 FName, Godot StringName)
Registry = 6        # 레지스트리 공통 틀(RegistrationList · RegistrationSlot · NameRegistry) — Delegate · 이름 · 로그를 쓴다
Time = 6
Spatial = 4         # 공간 인덱스(해시 그리드 · 쿼드/옥트리 · BVH) — Math 의 AABB · Frustum 과 컨테이너, 단언을 쓴다(로그 매크로는 안 쓴다)
GlobalVariable = 7
Task = 7
File = 8
Network = 8         # 다른 Core 폴더는 Network 를 include 하지 않는다
Module = 9
Diagnostics = 10    # 호출 스택 · 크래시 보고 · 메모리 프로파일러 · 교착 검출기 · 경합 보고기
Event = 10
Testing = 10        # 엔진 안 단위 테스트 틀(등록 · 단언 · 실행기) — 파일 · 로그 · 프로세스를 쓴다. 배포 구성은 짓지 않는다

# 하위 폴더 티어 — 바깥 폴더와 다른 티어에 서는 하위 폴더. 키는 `/` 가 들어 있어 따옴표로 감싼다(TOML).
[subtier]
"Concurrency/Queue" = 3   # 스레드 사이에서 나눠 쓰는 자료 구조(ConcurrentQueue · WorkStealingDeque · SpscQueue · LockedSwapQueue · SharedVectorPool) — vector 를 써서 Container 위
"Log/Sink" = 11           # 기본 싱크 AsyncLogSink 와 출력 장치 — 파일 · 프로세스 · 진단을 써서 맨 위(포트는 아래, 구현은 위)
