# 웹 클라이언트(wss://)의 TLS 종단 — 서버와 같은 파드(기계)에서 도는 HAProxy 3.2 설정 예시. 포트 · 인증서 경로는 자기 환경에 맞게 바꾼다.
# https 페이지는 혼합 콘텐츠라 wss:// 만 열 수 있고, 브라우저는 이름으로 인증서를 확인한다(공인 인증서 · 이름이 있어야 한다).
#   브라우저 ─wss(이 설정이 푼다)─▶ HAProxy ─PROXY v2 + WebSocket 평문(루프백)─▶ 서버(WebSocketAcceptTransport)
# 서비스 스트림의 로그인 · 거래는 WebSocket 안에서 다시 TLS 1.3 이고 게임 세션은 데이터그램마다 AEAD 다 — 이 프록시는 그 안을 보지 못한다.
#
# 서버 설정: `_servicePort` 17780 · `_gameStreamPort` 17777 · `_listGameStreamTrustedProxy` ["127.0.0.1"], 온라인 설정 `_listTrustedProxy` ["127.0.0.1"].
# 게임 UDP(7777)는 프록시를 지나지 않는다 — 바깥 TCP 7777 이 UDP 와 같은 번호라 서버 배정이 준 포트로 브라우저도 붙는다.
# 문서: https://docs.haproxy.org/3.2/configuration.html (5.1 alpn · crt · ssl-min-ver, 5.2 send-proxy-v2, 3.1 ssl-load-extra-del-ext)
global
    log stdout format raw local0
    # 쿠버네티스 tls 비밀의 이름 그대로 쓴다(tls.crt 옆의 tls.key).
    ssl-load-extra-del-ext
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # 서버의 유휴 시한(StreamTransportConfig::_idleTimeoutSeconds 60 초)보다 길게 — 끊는 쪽은 서버다.
    timeout client 75s
    timeout server 75s

# 네이티브 클라이언트의 서비스 포트(스트림 안 TLS 그대로 지난다). 서버가 신뢰 프록시의 연결만 받으므로 같이 지난다.
listen service_native
    bind :7780
    server local 127.0.0.1:17780 send-proxy-v2

# 브라우저의 서비스 포트. HTTP/2 로 협상하면 WebSocket 업그레이드(HTTP/1.1)를 못 하므로 ALPN 을 http/1.1 로 묶는다.
listen service_web
    bind :7443 ssl crt /etc/haproxy/tls/tls.crt alpn http/1.1
    server local 127.0.0.1:17780 send-proxy-v2

# 브라우저의 게임 세션 포트. 샤드가 여럿이면 샤드마다(+1) 한 묶음씩 둔다.
listen game_web
    bind :7777 ssl crt /etc/haproxy/tls/tls.crt alpn http/1.1
    server local 127.0.0.1:17777 send-proxy-v2
