# CheckTestSuites 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckTestSuites.py.

# 규칙 10 의 예외. 키는 `종류:이름` 둘이다.
#   pack:<이름>           — `game/<이름>/` 리터럴을 봐도 되는 이름. 나머지 실제 게임 팩은 `SW_TEST_REQUIRES_FEATURE( SourceResources )` 선언이 있어야 읽는다.
#                           테스트 코드에 그 리터럴이 하나도 없으면 낡은 줄이다.
#   pathOnly:<스위트.케이스> — 리터럴은 있지만 경로 문자열만 다루고 디스크의 팩을 읽지 않는 케이스. 리터럴만으로는 읽기와 구별되지 않아 케이스 단위로 선언한다.
#                           선언을 더하면 Shipping 에서 그 케이스가 건너뛰어져 커버리지를 잃으므로 선언 대신 여기에 둔다. 낡은 줄(리터럴이 없어짐)은 위반이다.
[exemption]
"pack:empty" = "활성 게임 — Shipping 도 구운 팩으로 갖고 있다"
"pack:test" = "임시 폴더 픽스처 이름(디스크의 실제 팩이 아니다)"
"pack:x" = "임시 폴더 픽스처 이름(디스크의 실제 팩이 아니다)"
"pack:demo" = "임시 폴더 픽스처 이름(디스크의 실제 팩이 아니다)"
"pack:probe" = "임시 폴더 픽스처 이름(디스크의 실제 팩이 아니다)"
