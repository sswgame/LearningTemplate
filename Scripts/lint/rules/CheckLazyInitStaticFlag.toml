# CheckLazyInitStaticFlag 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckLazyInitStaticFlag.py, 규칙은 docs/agents/Parallel.md "Lazy initialization".

# 전체 훑기의 기준선이다. 늘면 실패하고, 고쳐서 줄면 낮춘다(래칫). 커밋 훅은 추가한 줄만 본다.
#   total    : 맨 `static bool` 플래그 수.
#   lazyFill : 정적 · 전역 변수를 `if` 로 검사하고 같은 블록에서 채우는 곳(`static T* s_p = nullptr; if ( s_p == nullptr ) s_p = ...;`).
[baseline]
# 게이트가 잠금으로 읽던 부분 문자열(`lock`)이 `bLockWanted` · `getLockMode`(마우스 잠금)까지 잠금 구문으로 보고 위반을 가렸다. 낱말 경계의 잠금 형식 이름만 보도록 고쳐
# InputManagerX11.cpp 의 `s_bWaylandLockReported` 가 잡혔고, 그 칸은 `atomic<bool>::exchange` 한 번으로 바꿔 모양이 사라졌다(기준선 그대로). `inline static` 순서의 선언도 본다.
# 이 게이트가 아직 못 보는 모양(후보): 검사가 `if ( x ) return;` 이고 채움이 `if` 밖인 조기 반환형(`RenderDocCapture.cpp` 의 `_s_bTried`, `PosixShutdownSignal.cpp` 의 `s_bInstalled`).
# 마지막 하나(ShaderReflectionDx.cpp 의 dxcompiler 로더)는 셰이더 쿠킹 병렬화(cookfast)가 함수 안 정적 변수로 고쳐 0 이다.
total = 0
# 남은 다섯은 모두 메인 스레드(창 메시지 · 입력 설정) 전용이라 동시 첫 호출이 없다. 호출처를 끝까지 따라가 확인했고, 근거를 코드의 Debug 단언
# (`SW_ASSERT( engine::isOnPoolWorker() == false )`, EngineParallel.h — 엔진이 스레드를 만드는 길은 작업 풀뿐이다)으로 두었다:
#   - (고침) ImGuiOpenGLRendererBackend.cpp 의 s_MainDisplay : 검사를 지역 변수로 옮겨 정적 칸에는 한 번만 쓴다 — 모양이 사라져 기준선에서 빠졌다.
#   - Source/Engine/Input/Linux/InputManagerX11.cpp getOrCreateInputContext (s_pInputContext · s_pInputMethod) : 호출처는 postTextInput ← processNativeEvent
#     ← App::onWindowMessage(창 커스텀 핸들러, App::run 의 processMessages 안)뿐이다. 창 메시지는 창을 만든 스레드에서만 온다.
#   - 같은 파일 getOrCreateInvisibleCursor (s_pCursorDisplay) : 호출처는 setCursorVisiblePlatform ← InputManager::syncMouseLock(프레임 시작)뿐이다.
#     게임 쪽(PlayerControllerComponent)은 MouseDevice 의 플래그만 바꾸고 플랫폼 호출을 하지 않는다.
#   - Source/Engine/Input/Windows/InputManagerWin32.cpp s_bTrackingLeave : WM_MOUSEMOVE 처리 — processNativeEvent ← 위와 같은 창 메시지 펌프 안.
#   - 같은 파일 s_bDisabled : disable/restoreWindowsAccessibilityShortcuts. disable 의 호출처는 Source 안에 없고 restore 는 InputManager::shutdown 이 부른다.
# 소유 밖(다른 작업자 영역)이라 남긴 위반은 없다.
