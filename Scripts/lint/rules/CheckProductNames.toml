# CheckProductNames 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckProductNames.py.

# 뒤에 대문자가 와야 제품 낱말로 보는 것 — `Resp` 는 `Response` 와 겹친다.
capital_follows = ["Resp"]

# 제품 낱말 → 그 제품을 감싼 라이브러리 규칙 이름(CheckThirdPartyIsolation 의 라이브러리 표 — 허용 뿌리를 두 벌 두지 않는다).
# 빈 글자면 드라이버 · 플랫폼 폴더(*/Driver/* · */Windows/* · */Linux/*)에만 산다.
# 식별자의 낱말 머리나 camelCase 가운데(앞이 대문자가 아님)에 들면 걸린다. 뒤에 소문자가 이어지면 다른 낱말이다.
[product]
Sqlite = "SQLite"
SQLite = "SQLite"
Postgres = "PostgreSQL"
PostgreSql = "PostgreSQL"
PostgreSQL = "PostgreSQL"
OpenSsl = "OpenSSL"
OpenSSL = "OpenSSL"
Tracy = "Tracy"
Jolt = "Jolt"
Box2D = "Box2D"
Recast = "Recast"
Detour = "Recast"
HarfBuzz = "HarfBuzz"
SheenBidi = "SheenBidi"
Valkey = ""
Garnet = ""
Resp = ""
XAudio2 = ""
XInput = ""

# 제품을 골라 올리는 조립점(파일 fnmatch) → 이유.
[exemption]
"Source/GameFramework/Base/Online/Security/NetSecurity.cpp" = "보안 제공자 조립점 — OpenSSL 제공자를 고른다"
"Source/Engine/Audio/IAudioService.cpp" = "오디오 백엔드 팩토리 — XAudio2 를 고른다"
"Source/Editor/Common/Commands/Dev/EditorTracyLauncher.*" = "외부 프로파일러 GUI 를 띄우는 실행기 — 이름이 곧 대상 도구"
"Source/Editor/Panels/Profiler/ProfilerPanel.*" = "프로파일러 패널의 'Open Tracy' 버튼 — 외부 뷰어를 띄우는 자리(이름이 곧 대상 도구)"
"Source/Engine/Profiling/ProfilerBackend.*" = "프로파일러 백엔드 선택점 — Tracy 를 켜고 포트를 묻는 창구(외부 뷰어와 맞물린다)"
"Source/Engine/Physics/PhysicsSystem.cpp" = "물리 백엔드 팩토리 — Jolt · Box2D 백엔드를 고른다"
"Source/GameFramework/Kits/Feature/Storage/CacheStore/Server/CacheStoreFactory.*" = "서버 캐시 키트의 조립점 — RESP(Valkey · Garnet) 드라이버를 올린다"
