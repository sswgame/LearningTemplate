# CheckShaderConventions 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckShaderConventions.py.

# 불투명한 줄임말 — 이름을 camelCase 단어로 쪼갰을 때 이 단어가 하나라도 있으면 위반이다(`texColor` · `restNrm` · `instId`).
# C++ 의 "읽히는 이름" 규칙(docs/agents/NamingCpp.md: 루프 변수 `i` `j` `k` 금지, 줄임말은 풀어 쓴다)을 옮긴 것이다.
opaque_word = [
    "pos", "wpos", "nrm", "norm", "col", "clr", "vid", "idx", "tmp", "tex", "dir", "ao", "lum", "inst", "trans", "dtid",
    "gid", "gtid", "enc", "diff", "ndot", "ndotl", "cmp", "coord", "dummy", "cnt", "num", "val", "buf", "src", "dst",
]

# 함수 본문 안의 `#if` 에 써도 되는 백엔드 매크로 — 백엔드마다 다른 문법 · 리소스(FXC 의 리터럴 분기 · SPIR-V 의 속성 · bindless 에뮬)는 정의 하나로 못 가른다.
# 패스 · 기능 스위치(SW_PASS_* · SW_VIEWMODE_* · MATERIAL_* · SW_POST_*)는 여기 없다 — 파일 수준 `#if` 가 정의를 고른다.
backend_macro = ["DX11", "DX12", "__spirv__", "SW_NATIVE_BINDLESS"]
