# CheckDataDrivenStructure 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckDataDrivenStructure.py, 기준은 결정 기록 5-4 "유지보수성을 위한 데이터화" ①②.
#
# 이 게이트는 최후의 안전망이다. 위반을 못 쓰게 하는 것은 형식(경로 형식 · Optional · nodiscard 로더 — docs/plans/DataDriven.md 2절)이 먼저이고,
# 형식으로 막힌 종류는 [pattern] 에서 뺀다. 기준선은 0 으로 수렴해야 한다.

# 훑는 자리(저장소 기준). Test/ 는 보지 않는다(테스트 기대값 · 조각은 리터럴이 맞다).
scanRoots = ["Source", "Scripts", "cmake", "CMakeLists.txt"]

# 개수만 알리고 실패시키지 않는 종류 — 정규식으로 의도된 쓰임과 가리기 어렵다.
reportOnly = ["MagicNameLiteral", "LiteralGetDefault"]

# 언어 → 경로 끝(공백으로 나눈다). [pattern] 키의 가운데 칸이 이 이름이다.
[language]
cpp = ".h .hpp .inl .cpp"
py = ".py"
cmake = ".cmake CMakeLists.txt"

# "<종류>:<언어>:<이름>" = 정규식. 줄 하나에 한 번 센다. C++ 은 주석을 가린 글에서, 파이썬 · CMake 는 '#' 로 시작하는 줄을 빼고 본다.
[pattern]
"AssetPathLiteral:cpp:assetPath" = '"(?:engine|game|common|editor)/[^"\s]*\.(?:xml|json|material|png|dds|scene|prefab|ogg|wav|hlsli?|glb|mesh|animclip)"'
"SilentFallback:cpp:orDefault" = '\b\w+OrDefault\s*\('
"SilentFallback:cpp:fallbackParameter" = '\b(?:bool|float32|float64|int32|int64|uint32|uint64)\s+b?[fF]allback\w*\s*[,)=]'
"SilentFallback:cpp:fallbackLog" = '(?i)SW_LOG\w*\s*\(.*(?:using defaults?|falling back|기본값으로)'
"SilentFallback:cpp:emptyDefaultPath" = '\.empty\(\)\s*\?\s*k\w*Default'
"SilentFallback:py:swallowedException" = '^\s*except(?:\s+(?:Base)?Exception\b[^:]*)?\s*:\s*(?:#.*)?$'
"SilentFallback:py:environmentDefault" = '\benviron\.get\(\s*"[^"]+"\s*,\s*"[^"]+"'
"SilentFallback:cmake:defaultValue" = '\bDEFAULT_VALUE\b'
"DiscardedLoadResult:cpp:voidLoad" = '\(void\)\s*[\w:.>\-]*?\b(?:load|reload|parse|read)\w*\s*\('
"MagicNameLiteral:cpp:hashedString" = 'hashed_string\(\s*"'
"MagicNameLiteral:cpp:defaultLayer" = '\{\s*"Default"\s*\}'
"LiteralGetDefault:py:getDefault" = '\.get\(\s*"[^"]+"\s*,\s*(?:"[^"]*"|-?\d+(?:\.\d+)?|True|False)\s*\)'

# [pattern] 키 → 이 경로 패턴(fnmatch)에 맞는 파일만 본다. 없으면 그 언어의 모든 파일.
[scope]
"MagicNameLiteral:cpp:hashedString" = "Source/Games/*"

# [pattern] 키 → 맞은 줄 아래 들여 쓴 몸통에 이것이 있으면 위반이 아니다(삼킨 예외를 다시 던지거나 끝내는 블록).
[bodyEscape]
"SilentFallback:py:swallowedException" = '\braise\b|\bsys\.exit\('

# 빼 주는 파일 — "<종류>:<경로 패턴>" = "이유". 의도된 설계만 적는다.
[exemption]
"AssetPathLiteral:Source/Engine/Common/EngineDefines.h" = "부트스트랩 경로(enginedefaultassets.xml) — 다른 경로를 데이터에서 읽기 전에 정해져야 하는 첫 파일"
"AssetPathLiteral:Source/Editor/SelfTest/*" = "에디터 자가 테스트의 조각 — 테스트 기대값으로 고른 실제 에셋이다"

# 전체 훑기의 기준선 — "<종류>:<경로>" = 지금 남은 줄 수. 파일 하나라도 넘으면 실패, 줄면 낮추라고 알린다.
# 0 으로 수렴해야 한다. 고친 뒤 `py -3 Scripts/lint/gate/CheckDataDrivenStructure.py --print-baseline` 으로 다시 적는다.
