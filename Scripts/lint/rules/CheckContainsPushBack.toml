# CheckContainsPushBack 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckContainsPushBack.py, 규칙은 docs/agents/CppStyle.md 의 컨테이너 규칙("집합으로 거르고 contains 뒤 push_back 을 쓰지 않는다").
#
# 게이트로 막는 이유(최후 수단): `VectorUtil::contains` / `std::find` 는 어떤 vector 에나 쓰는 표준 모양이라 "중복 검사가 붙은 목록" 을 타입으로 구분할 수 없다.
# 포인터 목록은 형식(`Core/Container/IndexedPtrList.h`)으로 막았고(PrimitiveRegistry LOD 목록 · AnimationSystem LOD 클라이언트), 그 밖의 값 목록은 집합(`unordered_set`)을
# 곁에 두거나 모은 뒤 `VectorUtil::sortUnique` 한 번으로 거른다. 씬 로드 · 체크아웃에서 N 이 수천이 되는 곳에서 O(N^2) 가 실제로 났다.

# 전체 훑기의 기준선 — 지금 있는 건수다. 고치며 낮춘다. 늘면 실패한다(커밋 훅은 추가한 줄만 본다).
# 남은 건수는 모두 읽어서 N 을 가려 둔 것이다(`fixh`). 기준선 표:
#
#   묶음                      | 장소                                                                                              | N 의 크기 · 근거
#   ------------------------- | ------------------------------------------------------------------------------------------------- | ----------------------------------------
#   종류 · 필드 · 도메인 이름  | ShaderCookStamp · ReflectionDocWriter · RenderPassTypeInfo · ResourcePaths · CatalogDocument · CultureInfo · LiveLinkFace · ShaderCookRequest(define 조합, 2^k 에 k 상한) | 한 자릿수 ~ 수십. 한 번 계산하고 끝난다
#   그래프 · 의존 간선         | SubsystemCollection · RenderGraph · Component 선행 · SkeletalMeshComponent · FrameRendererPassExecute · RunMap · FixedLayout · PoseModifierComponent · DeadlockDetector | 노드 하나의 간선 수(한 자릿수)
#   전투 · 물리 쌍 · 파괴      | MeleeHitLedger · MeleeHitWindow · PhysicsPairFilter · DestructionDamage                           | 한 타격 · 한 등록의 수십 이하. 프레임마다 쌓이지 않는다
#   UI · 스타일               | UISystem · UIDocumentLoader · GameViewPanel · EditorService                                       | 한 문서 · 눌린 키 수십 이하
#   게임 규칙 데이터           | Metro* · Poker · RTSSelection · EconomyMirror · ActionStageRun · ZoneTracker · AIDirectorProfile · ScheduleCatalog · Shop · MeshMerger · AppearancePreload · SkirmishUnitComponent | 카탈로그 한 벌(수십 ~ 수백)에 한 번 돈다. 수백이어도 제곱은 10^5
#   네트워크 · 저장소 채널     | LocalServerBus · MemoryEphemeralStore · RespEphemeralStore · ChatService · MatchmakingServer · SQLMigrationRunner | 구독 채널 · 마이그레이션 파일 수(수십 이하)
#   임포트 · 에디터 도구       | ModelImport* · VrmRuntimeAssets · AnimationGraphPanel · EditorTestOutputParser · RigSecondaryNodes | 모델 하나 · 선택 하나의 수십 이하
#   상한이 걸린 목록           | AssetHotReload `_listChangedPath`                                                                 | `kMaxTrackedChangedPaths`(256) 가 상한이라 O(256)
#   프레임 안 · 비워지는 목록   | TransientAttachmentPool · MaterialCache `_listPSOWarmKey` · AutomationLogPolicy · SchemaMigrate    | 프레임 안의 수십, PSO 예열 목록은 프레임마다 비워진다
#   소유 밖의 진짜 후보        | EditorThumbnailCache `_listPendingID` · `_listFailedID`(Editor/Common/GUI)                        | 폴더에 썸네일 수천 개면 프레임마다 목록을 훑는다. 작업자 보고의 "같은 결함 후보" 에 올렸다
