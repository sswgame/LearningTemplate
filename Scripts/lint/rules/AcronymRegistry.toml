# 약어 등록부의 데이터 — 읽는 코드와 철자 규칙은 Scripts/lint/AcronymRegistry.py, 규칙 설명은 AGENTS.md "Function names".
# 게이트(CheckAcronymSpelling · CheckFunctionVocabulary) · 코드모드(FormatAcronymSpelling) · 에디터 아이콘 생성기가 같이 읽는다.

# 등록된 약어(대문자 철자).
acronym = [
    "UI", "GPU", "AI", "HTTP", "XML", "JSON", "SQL", "IO", "LOD", "RTS", "SRPG", "HUD", "URL", "UUID", "DDS", "TLS", "UDP", "IK",
    "API", "RPC", "PSO", "CPU", "RHI", "AABB", "ID", "QA", "DSP", "MMO", "ACL", "GUI", "RPG", "JRPG",
]

# 게이트가 막는 약어. 약어 하나를 트리 전체에서 바꾼 커밋이 그 약어를 여기에 올린다 — 그 전까지 게이트는 보고만 한다.
enforced = [
    "HUD", "IK", "DDS", "TLS", "UDP", "URL", "UUID", "RTS", "SRPG", "SQL", "AI", "LOD", "API", "RPC", "PSO", "XML", "JSON", "HTTP",
    "IO", "UI", "GPU", "CPU", "RHI", "AABB", "DSP", "MMO", "ACL", "GUI", "RPG", "JRPG", "ID", "QA",
]

# 복수 `s` 를 붙여 쓰지 않는 약어 — `Ios` 는 `IO` 의 복수가 아니라 플랫폼 이름(iOS)이다.
no_plural = ["IO"]

# 제품 이름(정본 철자). 약어 규칙이 건드리지 않는다(`ImGui` → `ImGUI` 가 되지 않는다).
product = ["ImGui", "OpenSSL", "SQLite", "Box2D", "Jolt", "FreeType", "HarfBuzz", "OpenGL", "DirectX"]

# 이 이름공간 뒤(`ns::`)의 식별자는 남의 이름이다.
external_namespace = [
    "std", "ImGui", "JPH", "ax", "ed", "NodeEditor", "nlohmann", "pugi", "acl", "rtm", "fmt", "Microsoft", "WRL", "DirectX", "tinyxml2", "moodycamel",
]

# 앞머리(AcronymRegistry.kExternalPrefixRe)로 가려지지 않는 남의 이름(Win32 함수 · DXGI · ImGui 구조체 멤버). 사전 실행
# (`FormatAcronymSpelling --report`)의 "외부 헤더에도 있는 이름" 이 후보를 내고, 사람이 남의 이름인지 보고 여기에 올린다 — 코드모드는
# 외부 헤더를 직접 읽지 않는다(기계마다 깔린 SDK 가 달라 같은 트리를 다르게 고치면 안 된다).
external_name = [
    "GetCurrentProcessId", "GetCurrentThreadId", "GetProcessId", "GetThreadId", "GetWindowThreadProcessId", "CancelIoEx",
    "CreateIoCompletionPort", "UuidCreate", "UuidToStringA", "UuidFromStringA", "dwProcessId", "dwThreadId",
    "VendorId", "DeviceId", "SubSysId",
    "ActiveId", "ActiveIdHasBeenEditedThisFrame", "HoveredId", "DockId", "ThreadId",
    "shapeIdA", "shapeIdB", "bodyIdA", "bodyIdB", "sensorShapeId", "visitorShapeId", "userMaterialId",
    "minLod", "maxLod", "mipLodBias",
    "queryId",
]

# 약어처럼 보이지만 줄임말인 낱말 → 이유. `acronym` 에 오르면 등록부 검사(checkRegistry)가 멈춘다.
[not_acronym]
Nav = "navigation 의 줄임말"
Anim = "animation 의 줄임말"
Gimmick = "낱말 그대로"
Net = "network 의 줄임말"
Dev = "development 의 줄임말"
Resp = "response 의 줄임말"
Std = "C++ 표준 라이브러리 이름(std)"
Idx = "index 의 줄임말 — `Id` 와 다른 낱말이다"
Info = "information 의 줄임말"

# 제품 이름의 옛 철자 → 정본(`product`). 코드모드가 정본으로 고쳐 쓴다.
[product_variant]
OpenSsl = "OpenSSL"
Sqlite = "SQLite"

# 제품 이름(`product`) → `--acronym` 으로 고르는 이름표(`SSL` 을 고르면 `OpenSsl` → `OpenSSL`).
[product_acronym]
OpenSSL = "SSL"
SQLite = "SQL"
