# CheckServiceAccess 의 규칙 데이터 — 게이트는 Scripts/lint/gate/CheckServiceAccess.py.

# `engine::` 아래에 남는 `get*` 자유 함수. 서비스 접근은 `engine::getSubsystem<T>()` · `findSubsystem<T>()` 두 이름이고,
# 나머지는 서비스 창구가 아닌 것이다. 여기 없는 `engine::getXxx(` 는 지워진 이름 붙은 접근자(`getTypeRegistry()` 따위)로 본다.
allowed_engine_function = [
    "getSubsystem",
    "getEngineSubsystems",
    "getParallelScratchSlot",
    "getParallelScratchSlotCount",
    "getEngineAbiStamp",
]

# 예외의 종류 → 뜻. 아래 `[exemption]` 의 값은 자유 글이 아니라 이 표의 키 중 하나여야 한다(표 밖 키는 게이트가 거절한다).
# 새 종류가 필요하면 그 이유가 이 표의 한 줄이 된다 — 종류가 늘어나는 것이 곧 "서브시스템으로 못 만드는 경우" 가 늘어나는 것이다.
[exemption_kind]
LinkTimeRegistry = "링크 때 정적 등록자가 채우는 표 — 엔진 범위가 서기 전에 올라가고 모듈을 내릴 때 빠진다(Core 층은 엔진 범위를 모른다)"
CrashPath = "크래시 핸들러 · 전역 할당 훅이 읽는 저장소 — 범위가 서기 전 · 사라진 뒤 · 시그널 안에서도 잠금 없이 읽어야 한다(Core 층)"
ScopeOwnedHotPath = "범위(엔진 · 게임)가 소유한 저장소의 창구 — 핫 패스나 Core 층이 범위 조회 없이 잠금 없이 읽는다"
Stateless = "상태 없는 함수 묶음 — 서비스가 아니라 순수 함수 · 드라이버다"
ScopeRoot = "소유 범위의 뿌리 — 값(`ScopeOwned<T>`)이 자기를 어디에 등록할지 정하는 칸이라 엔진 범위(서브시스템)보다 먼저 서야 한다(Core 층)"

# 헤더에서 `static … getInstance()` 나 정적 활성 창구 `static T* findActive…()` · `getActive…()` 를 가져도 되는 타입 → 예외 종류.
# 새 서비스는 서브시스템으로 만들어 범위에 넣고, "지금 도는 것" 은 소유자가 범위에 빌려 건다(`SubsystemScope::bind`).
[exemption]
RawAnimationCodec = "Stateless"
ACLAnimationCodec = "Stateless"
SQLiteDriver = "Stateless"          # 결정 기록 5-8
PostgresDriver = "Stateless"        # 결정 기록 5-8
TestRegistry = "LinkTimeRegistry"   # 테스트 프레임워크의 등록 표
RigNodeRegistry = "LinkTimeRegistry"
DevCommandRegistry = "LinkTimeRegistry"
DebugHUDRegistry = "LinkTimeRegistry"
EditorSettingsInstance = "LinkTimeRegistry" # 설정 페이지 등록 줄의 인스턴스 함수 표 — 등록 항목이 함수 포인터로 든다
EditorSettingsPageNone = "LinkTimeRegistry" # 같은 표의 빈 자리(그리기 함수 방식)
GameAutoplay = "LinkTimeRegistry"   # 활성 창구 아님 — findActive 는 링크 때 등록 표(RegistrationList)의 마지막 줄을 읽고 정적 포인터를 들지 않는다
LifetimeScope = "ScopeRoot"
EditorExtensionRegistry = "LinkTimeRegistry" # 에디터 확장 종류별 목록은 EditorModule 이 소유하고, 이 템플릿은 DLL 마다 그 목록을 한 번 찾아 두는 캐시다
MemoryProfiler = "CrashPath"        # 전역 operator new/delete 훅이 읽는다
CrashContextStore = "CrashPath"
CrashBreadcrumbStore = "CrashPath"
CompressionCodecRegistry = "ScopeOwnedHotPath" # Core 의 CompressionStream 이 레지스트리를 받지 않았을 때 읽는 칸(엔진 초기화가 연결한다)
ProfilerBackend = "ScopeOwnedHotPath" # 프로파일 구간이 렌더 · 작업 스레드에서 읽는다(범위 조회는 선형 검색이라 핫 패스에 못 둔다)
IWindow = "ScopeOwnedHotPath"       # Engine 이 만든 창을 App 에 넘기는 소유권 전달 칸이자 입력 · RHI 가 읽는 관찰 포인터. 범위로 옮기는 일은 계획 문서 `AppStructure` 의 A7
SceneTransformStorage = "ScopeOwnedHotPath" # 엔진 수명 범위가 소유하는 저장소 — 변환 컴포넌트가 핫 패스에서 읽는다
ValidationIssueLog = "ScopeOwnedHotPath"    # 범위가 소유하는 표 — 파괴 경로도 부르므로 범위 조회를 거치지 않는다. 월드 소유로 옮기는 일은 Candidates-engine 의 ValidationIssueLogWorldOwned
BehaviorTaskRegistry = "LinkTimeRegistry" # 게임 · 키트 모듈 이미지의 정적 등록자(`SW_BEHAVIOR_TASK`)가 채우는 작업 이름 표
GameInstanceBase = "Stateless"      # 활성 창구 아님 — findActiveObjectManager 는 게임 범위를 올라가 찾는 편의 함수이고 정적 포인터를 들지 않는다
