PostgresDriver = "상태 없는 드라이버 — 결정 기록 5-8"
TestRegistry = "테스트 프레임워크의 링크 때 등록 표 — 엔진 범위가 서 있기 전에 채워진다"
RigNodeRegistry = "링크 때 등록 표 — 엔진 범위가 서 있기 전에 채워진다"
