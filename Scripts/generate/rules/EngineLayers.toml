# 엔진 층 표 — 읽는 곳은 Scripts/generate/EngineLayers.py(→ EngineLayers.cmake). 예전 린트 게이트 engine-layers(include 글자 검사)를 빌드 형식이 대신한다:
# Source/Engine/CMakeLists.txt 가 층마다 부분(OBJECT, 오브젝트는 Engine 이미지 안)을 짓고 위 층 헤더 자리에 #error 껍데기를 놓아, 위 층 헤더 include 가
# 컴파일에서 멈춘다(헤더를 거쳐 닿는 전이 include 도 같다) — 언리얼 Core → CoreUObject → Engine → Renderer 같은 모듈 DAG.
#
# 키는 `Source/Engine/` 아래 경로 접두어(폴더 또는 파일)이고 가장 긴 것이 이긴다. 같은 층끼리는 include 해도 된다.
# 표에 없는 파일이 있으면 configure 가 멈춘다 — 새 폴더는 층을 정하고 들어온다.
[tier]
# 0 — 엔진 바닥: 공용 형식
Foundation = 0
Compression = 0
"pch.h" = 0
"pch.cpp" = 0
"EngineMinimal.h" = 0
"EngineFrameHooks.h" = 0
"EngineStartupExtension.h" = 0        # 호스트가 기동 단계에 서브시스템을 더하는 확장점(형만 앞으로 선언한다)
# 1 — 기반: 리플렉션 · 직렬화 · 설정 · 콘텐츠 파일 시스템 · 관측
Reflection = 1
Curve = 1
Serialization = 1
Config = 1
Profiling = 1
Observability = 1
FileSystem = 1                       # 리소스 id · 경로 · 낱개 파일 · 팩 · 쿠킹 읽기 기록 — 직렬화 · 설정이 읽는다. 팩 매니저는 에셋 층이 건다(AssetIO::bindPackManager)
CoreServices = 1
Console = 1
"Module/ModuleTypeRegistry.h" = 1    # 모듈 이미지의 타입 등록 선언(Core 만) — 구현(.cpp)은 리로드 때 씬을 다시 묶어 맨 위 층이다
"Module/ModuleObjectRegistrar.h" = 1   # 모듈 이미지의 정적 등록자 바탕(Core 만) — 낮은 층의 레지스트리(일괄 틱 · 5 층)가 상속해 E1 사전 등록 사슬에 단다
"Module/ModuleObjectRegistrar.cpp" = 1 # 링크 때 목록 머리 하나뿐(Core 만)
# 2 — 콘텐츠: 에셋 · 글 · 현지화
Asset = 2
Text = 2
Localization = 2
# 3 — 플랫폼: 창 · 입력
Window = 3
Input = 3
# 4 — RHI · CPU 쪽 그래픽 데이터
Graphics = 4
# 5 — 월드: 컴포넌트 모델 코어 · 씬
Object = 5
Scene = 5
"Automation/Watch" = 5               # 감시 값은 대상 객체를 찾아 읽는다 — 기능(6)이 자기 폴더에서 등록한다
# 6 — 기능: 각자 자기 컴포넌트 · 씬 서비스를 든다
Physics = 6
Audio = 6
Animation = 6
Navigation = 6
TileMap = 6
VFX = 6
Sequencer = 6
Dialogue = 6
Environment = 6
Destruction = 6
DedicatedServer = 6
Character = 6
UI = 6
Net = 6
UserSettings = 6
"Automation/Scenario" = 6
"2D" = 6                             # 2D 컴포넌트(스프라이트 · 2D 라이트 · 그림자 · 패럴랙스 · 픽셀 퍼펙트 카메라) — 스프라이트 클립 · 타일맵을 쓴다(언리얼 Paper2D)
Telemetry = 6                        # 크래시 · 원격 측정은 엔진 전체(사용자 설정 · 하드웨어 · 팩 설정)를 보고한다 — 엔진 루프(8)만 include 한다
# 7 — 렌더러(렌더 스레드 · GPU 파이프라인, 전용 서버는 짓지 않는다)
Renderer = 7
# 8 — 맨 위: 엔진 루프 조립 · 모듈 핫 리로드(씬 · 에셋 · 입력을 다시 묶는다) · 자동화 실행기
Module = 8
Automation = 8
"Engine.h" = 8
"Engine.cpp" = 8
"EngineSubsystemSet.h" = 8
"EngineSubsystemSet.cpp" = 8
"HeadlessSubsystem.h" = 8
"HeadlessSubsystem.cpp" = 8
"HostServices.h" = 8
